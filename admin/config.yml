backend:
  name: git-gateway
  branch: flexbox-sticky-footer

media_folder: "assets/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "攻略記事"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "タイトル", name: "title", widget: "string" }
      - { label: "本文", name: "body", widget: "markdown" }